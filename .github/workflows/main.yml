name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Keep merges from uploading to the same draft at the same time.
concurrency:
  group: application-release
  cancel-in-progress: false

jobs:
  package:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      # electron-builder creates/reuses the draft; serialize its two uploaders.
      max-parallel: 1
      matrix:
        include:
          - runner: windows-2025
            arch: x64
            platform: win
          - runner: macos-15
            arch: arm64
            platform: mac
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          architecture: ${{ matrix.arch }}
      - name: Install exact dependencies and tools
        run: npm ci
      - name: Package and upload to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          EP_DRAFT: 'true'
        run: npm run publish -- --${{ matrix.platform }} --${{ matrix.arch }}
